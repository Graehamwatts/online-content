name: Daily Attribution Brief

on:
  # Mon-Fri at 7:15 AM Pacific.
  # GitHub runs cron in UTC. 7:15 AM PT = 14:15 UTC (PDT, Mar-Nov) / 15:15 UTC (PST, Nov-Mar).
  # Use 14:15 UTC year-round and let the script self-check the Pacific date.
  schedule:
    - cron: '15 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Override "yesterday" date (YYYY-MM-DD). Leave blank for default.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build attribution brief
        id: build
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python .github/scripts/daily_attribution_brief.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboards/attribution/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily attribution brief — $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No dashboard changes to commit."
          fi

      - name: Send email via Gmail SMTP
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_SUBJECT: ${{ steps.build.outputs.subject }}
          BRIEF_HTML_PATH: ${{ steps.build.outputs.html_path }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "GMAIL_USER / GMAIL_APP_PASSWORD secrets not set — skipping email send. Brief is committed to repo."
            exit 0
          fi
          python .github/scripts/send_brief_email.py
