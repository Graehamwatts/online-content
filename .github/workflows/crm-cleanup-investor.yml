name: Cleanup Investor/Flipper Pipeline
env:
  GHL_API_BASE: https://services.leadconnectorhq.com
  GHL_VERSION: '2021-07-28'
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install requests
    - name: Run cleanup
      env:
        GHL_PIT: ${{ secrets.GHL_PIT }}
        GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
        PYTHONUNBUFFERED: '1'
      run: python3 scripts/crm_cleanup_investor.py
    - name: Summary
      run: |
        if [ "${WORKFLOW_VALUE_1}" = "true" ]; then
          echo "### Dry Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "No records deleted. Review the log above, then re-run with **dry_run = false** to execute." >> $GITHUB_STEP_SUMMARY
        else
          echo "### Cleanup Complete" >> $GITHUB_STEP_SUMMARY
          echo "Investor/Flipper pipeline opportunities deleted. Contacts were not affected." >> $GITHUB_STEP_SUMMARY
        fi
      env:
        WORKFLOW_VALUE_1: ${{ github.event.inputs.dry_run }}
    environment: service-automation
    permissions:
      contents: read
'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — preview only, NO deletions
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
permissions:
  contents: read
