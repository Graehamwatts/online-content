name: Farming Postcard Preview
permissions:
  contents: read
concurrency:
  group: farming-postcard-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postcard-preview:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Resolve mode from trigger
      run: python3 scripts/resolve_postcard_inputs.py
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FORCE_TARGET: ${{ inputs.force_target }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
    - name: Run (remind / watchdog)
      if: env.MODE == 'remind' || env.MODE == 'watchdog'
      env:
        GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        POSTCARD_RECIPIENTS: ${{ secrets.POSTCARD_RECIPIENTS }}
        PYTHONUNBUFFERED: '1'
      run: python3 scripts/postcard_preview_reminder.py
    - name: Run (generate options via Sakana)
      if: env.MODE == 'generate'
      run: |
        echo "::error::Generation is paused until recipient/state output is private."
        exit 1
    - name: Commit state markers only
      if: env.DRY_RUN != '1'
      run: |
        git config user.email "graehamwatts@gmail.com"
        git config user.name "Graeham Watts"
        git add automation_state/farming_postcards/
        if ! git diff --staged --quiet; then
          git commit -m "postcard preview: state update [skip ci]"
          git push
        fi
    - name: Open issue on failure
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh issue create \
          --title "Postcard preview FAILED ($(date -u +%Y-%m-%d), mode ${MODE:-unknown})" \
          --body "The farming-postcard preview workflow failed. SMTP may be down, so this issue is the backup alert. Run: ${GITHUB_RUN_URL}. If a drop is near, generate options manually via the farming-postcard skill."
    environment: service-automation
    permissions:
      contents: write
      issues: write
'on':
  schedule:
  - cron: 17 15 8,24 * *
  - cron: 17 16 8,24 * *
  - cron: 23 16 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: remind | generate | watchdog
        type: choice
        options:
        - remind
        - generate
        - watchdog
        default: generate
      dry_run:
        description: Print instead of send
        type: boolean
        default: false
      force_target:
        description: Override drop date YYYY-MM-DD (optional)
        type: string
        default: ''
