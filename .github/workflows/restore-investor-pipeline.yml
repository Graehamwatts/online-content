name: Restore Investor/Flipper Pipeline
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install requests
    - name: Run restore
      env:
        GHL_PIT: ${{ secrets.GHL_PIT }}
        GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
        PYTHONUNBUFFERED: '1'
      run: python3 scripts/restore_investor_pipeline.py
    environment: service-automation
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.actor == 'Graehamwatts' && github.triggering_actor == 'Graehamwatts'))
'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (true = preview, false = actually restore)
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
permissions:
  contents: read
