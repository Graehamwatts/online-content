name: Friday CRM Health Review

on:
  schedule:
    - cron: '0 0 * * 6'  # Friday 4:00 PM PT (midnight UTC = Friday 5pm PT; close enough)
  workflow_dispatch:
    inputs:
      week_start_override:
        description: 'Override week start date (YYYY-MM-DD, Monday; blank = auto)'
        required: false
        default: ''

env:
  GHL_API_BASE: https://services.leadconnectorhq.com
  GHL_VERSION: '2021-07-28'

jobs:
  weekly-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Generate CRM Health Dashboard
        id: generate
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          PYTHONUNBUFFERED: "1"
          WEEK_START_OVERRIDE: ${{ github.event.inputs.week_start_override }}
        run: python3 scripts/weekly_crm_health.py

      - name: Commit and push dashboard
        run: |
          git config user.email "graehamwatts@gmail.com"
          git config user.name "Graeham Watts"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Graehamwatts/online-content.git
          git add dashboards/health/
          git diff --staged --quiet || git commit -m "CRM Health: ${{ steps.generate.outputs.date_slug }} (score ${{ steps.generate.outputs.health_score }}/${{ steps.generate.outputs.grade }})"
          git push

      - name: Report result
        run: |
          URL="https://graehamwatts.github.io/online-content/dashboards/health/${{ steps.generate.outputs.date_slug }}-health.html"
          echo "::notice title=CRM Health Dashboard::Score ${{ steps.generate.outputs.health_score }} (Grade ${{ steps.generate.outputs.grade }}) | ${{ steps.generate.outputs.total_leads }} leads | ${{ steps.generate.outputs.stale_count }} stale deals | $URL"
          echo "Dashboard: $URL"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::CRM Health Report failed. Check GHL_PIT secret and GHL API availability."
