name: Friday Attribution Review
jobs:
  weekly-attribution:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install requests pytz
    - name: Generate Weekly Attribution Review
      id: generate
      env:
        GHL_PIT: ${{ secrets.GHL_PIT }}
        GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        BRIEF_RECIPIENTS: ${{ secrets.BRIEF_RECIPIENTS }}
        DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        PYTHONUNBUFFERED: '1'
      run: python3 scripts/friday_attribution_review.py
    - name: Commit dashboard
      run: |
        git config user.email "graehamwatts@gmail.com"
        git config user.name  "Graeham Watts"
        git add dashboards/attribution/
        git diff --staged --quiet || git commit -m \
          "Weekly Attribution Review: ${WORKFLOW_VALUE_1} (${WORKFLOW_VALUE_2} leads, ${WORKFLOW_VALUE_3} wins)"
        git push
      env:
        WORKFLOW_VALUE_1: ${{ steps.generate.outputs.week_label }}
        WORKFLOW_VALUE_2: ${{ steps.generate.outputs.total_leads }}
        WORKFLOW_VALUE_3: ${{ steps.generate.outputs.total_wins }}
    - name: Report result
      run: |
        echo "::notice title=Weekly Attribution::Week ${WORKFLOW_VALUE_1} | \
        Leads: ${WORKFLOW_VALUE_2} | \
        Wins: ${WORKFLOW_VALUE_3} | \
        Top source: ${WORKFLOW_VALUE_4}"
      env:
        WORKFLOW_VALUE_1: ${{ steps.generate.outputs.week_label }}
        WORKFLOW_VALUE_2: ${{ steps.generate.outputs.total_leads }}
        WORKFLOW_VALUE_3: ${{ steps.generate.outputs.total_wins }}
        WORKFLOW_VALUE_4: ${{ steps.generate.outputs.top_source }}
    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::Friday Attribution Review failed. Check GHL_PIT, GMAIL_USERNAME, GMAIL_APP_PASSWORD, BRIEF_RECIPIENTS secrets."
    environment: service-automation
    permissions:
      contents: write
'on':
  schedule:
  - cron: 0 23 * * 5
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip sending email (still commits the dashboard)
        type: boolean
        default: false
permissions:
  contents: read
