name: Friday Attribution Review

on:
  schedule:
    - cron: '0 0 * * 6'  # Friday 4:00 PM PT (midnight UTC Saturday = Friday 5pm PT; use 00:00 UTC Sat)
  workflow_dispatch:
    inputs:
      week_start_override:
        description: 'Override week start date (YYYY-MM-DD, Monday; blank = auto)'
        required: false
        default: ''

env:
  GHL_API_BASE: https://services.leadconnectorhq.com
  GHL_VERSION: '2021-07-28'

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Generate Weekly Attribution Review
        id: generate
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          PYTHONUNBUFFERED: "1"
          WEEK_START_OVERRIDE: ${{ github.event.inputs.week_start_override }}
        run: |
          python3 << 'PYEOF'
          import requests, os, sys, json
          from datetime import datetime, timedelta, timezone
          import pytz
          
          print("=== GHL API DIAGNOSTIC ===", flush=True)
          
          PT = pytz.timezone("America/Los_Angeles")
          GHL_PIT = os.environ["GHL_PIT"]
          LOCATION_ID = os.environ["GHL_LOCATION_ID"]
          GHL_BASE = "https://services.leadconnectorhq.com"
          
          headers = {
              "Authorization": f"Bearer {GHL_PIT}",
              "Version": "2021-07-28",
              "Content-Type": "application/json"
          }
          
          # Window: Mon this week → now
          now_utc = datetime.now(timezone.utc)
          week_start_utc = (now_utc - timedelta(days=6)).replace(hour=0,minute=0,second=0,microsecond=0)
          start_ms = int(week_start_utc.timestamp() * 1000)
          print(f"Window start: {week_start_utc} ({start_ms})", flush=True)
          
          def test_call(name, fn):
              print(f"--- TEST: {name} ---", flush=True)
              try:
                  r = fn()
                  print(f"  Status: {r.status_code}", flush=True)
                  print(f"  Body[:300]: {r.text[:300]}", flush=True)
                  return r
              except Exception as e:
                  print(f"  EXCEPTION: {type(e).__name__}: {e}", flush=True)
                  return None
          
          # 1. Custom fields
          test_call("GET /locations/{id}/customFields",
              lambda: requests.get(f"{GHL_BASE}/locations/{LOCATION_ID}/customFields",
                                   headers=headers, timeout=(5,15)))
          
          # 2. Pipelines
          test_call("GET /opportunities/pipelines",
              lambda: requests.get(f"{GHL_BASE}/opportunities/pipelines",
                                   params={"locationId": LOCATION_ID},
                                   headers=headers, timeout=(5,15)))
          
          # 3. GET /contacts with startAfter (NEW endpoint)
          test_call("GET /contacts?startAfter=<week_start>",
              lambda: requests.get(f"{GHL_BASE}/contacts",
                                   params={"locationId": LOCATION_ID, "startAfter": start_ms, "limit": 5},
                                   headers=headers, timeout=(5,15)))
          
          # 4. POST /contacts/search (old endpoint, no filters)
          test_call("POST /contacts/search (no filters, limit 5)",
              lambda: requests.post(f"{GHL_BASE}/contacts/search",
                                    headers=headers,
                                    json={"locationId": LOCATION_ID, "page": 1, "pageLimit": 5},
                                    timeout=(5,15)))
          
          # 5. GET /opportunities/search
          test_call("GET /opportunities/search",
              lambda: requests.get(f"{GHL_BASE}/opportunities/search",
                                   params={"location_id": LOCATION_ID, "startAfter": start_ms, "limit": 5},
                                   headers=headers, timeout=(5,15)))
          
          print("\n=== DIAGNOSTIC COMPLETE ===", flush=True)
          
          PYEOF

      - name: Commit and push dashboard
        run: |
          git config user.email "graehamwatts@gmail.com"
          git config user.name "Graeham Watts"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Graehamwatts/online-content.git
          git add dashboards/attribution/
          git diff --staged --quiet || git commit -m "Weekly Attribution Review: ${{ steps.generate.outputs.date_slug }}"
          git push

      - name: Report result
        run: |
          URL="https://graehamwatts.github.io/online-content/dashboards/attribution/${{ steps.generate.outputs.date_slug }}-weekly.html"
          echo "::notice title=Weekly Attribution Review::Sent — ${{ steps.generate.outputs.total_leads }} leads, top source: ${{ steps.generate.outputs.top_source }}, dashboard at $URL"
          echo "Dashboard: $URL"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly Attribution Review failed. Check GHL_PIT secret and GHL API availability."
