name: Run CRM Health Now

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Run health check
        env:
          GHL_PIT:          ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID:  ${{ secrets.GHL_LOCATION_ID }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/weekly_crm_health.py
      - name: Commit dashboard output
        run: |
          git config user.email "graehamwatts@gmail.com"
          git config user.name  "Graeham Watts"
          git add dashboards/health/
          git diff --staged --quiet || git commit -m "Dashboard update $(date -u +%Y-%m-%d)"
          git push
